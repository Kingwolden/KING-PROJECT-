<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#080808"><title>KING: The Royal Maze</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}body{font-family:Arial,sans-serif;color:#f3d477;user-select:none;-webkit-user-select:none;touch-action:none}#app{height:100dvh;display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 35%,#2b220d,#100d08 35%,#080808 75%);padding-top:env(safe-area-inset-top)}header{width:min(94vw,520px);display:flex;justify-content:space-between;padding:12px 4px 8px;font-weight:900}.title{font-size:20px}.stats{font-size:11px;text-align:right;line-height:1.5}#gameWrap{position:relative;width:min(94vw,520px);aspect-ratio:1;max-height:calc(100dvh - 205px)}canvas{width:100%;height:100%;display:block;border-radius:14px;border:1px solid #4a3a15;background:#0b0b0b}#menu,#over,#win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505dd;border-radius:14px;text-align:center;z-index:5}.hidden{display:none!important}.big{font:900 clamp(44px,13vw,72px) Georgia,serif;letter-spacing:.08em;text-shadow:0 0 22px #f3d47766}.sub{margin-top:6px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#d7bf78aa}button{border:1px solid #d9bd65;background:#17130a;color:#f5d47b;border-radius:12px;padding:14px 30px;font-weight:900;letter-spacing:.12em;margin-top:24px;font-size:15px}#controls{width:min(94vw,520px);height:122px;position:relative;flex:none}.dpad{position:absolute;left:8px;bottom:10px;width:112px;height:112px}.pad{position:absolute;width:42px;height:42px;border:1px solid #8d7740;background:#17130b;color:#f3d477;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}.pad:active{background:#5c4a20;transform:scale(.95)}.up{left:35px;top:0}.left{left:0;top:35px}.right{right:0;top:35px}.down{left:35px;bottom:0}#note{position:absolute;right:7px;bottom:16px;width:170px;text-align:right;color:#f3d47755;font-size:10px;line-height:1.4}</style></head><body><div id="app"><header><div class="title">👑 KING</div><div class="stats">LEVEL 01<br>SHADES: <span id="score">0</span>/<span id="total">0</span></div></header><div id="gameWrap"><canvas id="game" width="560" height="560"></canvas><div id="menu"><div class="big">KING</div><div class="sub">THE ROYAL MAZE</div><button id="play">PLAY</button><div class="sub">A completely unnecessary King experience.</div></div><div id="over" class="hidden"><div class="big">GAME OVER</div><div class="sub">The Golems have won.</div><button id="retry">TRY AGAIN</button></div><div id="win" class="hidden"><div class="big">ROYAL VICTORY</div><div class="sub">All shades collected.</div><button id="again">PLAY AGAIN</button></div></div><div id="controls"><div id="note">👆 SWIPE TO MOVE<br>Collect every 🕶️<br>Avoid the 🗿</div></div></div><script>(function(){var C=document.getElementById('game'),X=C.getContext('2d'),S=560,N=21,T=S/N,L=["111111111111111111111","100000000010000000001","101111011010110111101","100000000000000000001","101101111011110110101","100100000000000001001","111101011111101011111","100000010040001000001","101111010111101011101","100000000520000000001","101111010131101011101","100000010000001000001","111101011111101011111","100100000000000001001","101101111011110110101","100000000000000000001","101111011010110111101","100000000010000000001","101111111010111111101","100000000000000000001","111111111111111111111"];var g,k,gs,total,score,run=false,dir={x:0,y:0},q={x:0,y:0},last=0,acc=0;function reset(){g=L.map(function(r){return r.split('').map(Number)});gs=[];total=0;score=0;for(var y=0;y<N;y++)for(var x=0;x<N;x++){if(g[y][x]==2)total++;if(g[y][x]==4){gs.push({x:x,y:y});g[y][x]=0}if(g[y][x]==5){k={x:x,y:y};g[y][x]=0}}document.getElementById('score').textContent=0;document.getElementById('total').textContent=total}function open(d){var x=k.x+d.x,y=k.y+d.y;if(x>=0&&x<N&&y>=0&&y<N&&g[y][x]!=1)q=d}function step(){if(!run)return;var x=k.x+q.x,y=k.y+q.y;if((q.x||q.y)&&x>=0&&x<N&&y>=0&&y<N&&g[y][x]!=1)dir=q;x=k.x+dir.x;y=k.y+dir.y;if(x>=0&&x<N&&y>=0&&y<N&&g[y][x]!=1){k.x=x;k.y=y}if(g[k.y][k.x]==2){g[k.y][k.x]=0;score++;document.getElementById('score').textContent=score;if(score==total){run=false;document.getElementById('win').classList.remove('hidden')}}if(g[k.y][k.x]==3)g[k.y][k.x]=0;gs.forEach(function(a){var o=[[1,0],[-1,0],[0,1],[0,-1]].filter(function(d){var x=a.x+d[0],y=a.y+d[1];return x>=0&&x<N&&y>=0&&y<N&&g[y][x]!=1});if(o.length){o.sort(function(A,B){return Math.abs(a.x+A[0]-k.x)+Math.abs(a.y+A[1]-k.y)-(Math.abs(a.x+B[0]-k.x)+Math.abs(a.y+B[1]-k.y))});var d=Math.random()<.8?o[0]:o[Math.floor(Math.random()*o.length)];a.x+=d[0];a.y+=d[1]}});if(gs.some(function(a){return a.x==k.x&&a.y==k.y})){run=false;document.getElementById('over').classList.remove('hidden')}}function draw(){X.clearRect(0,0,S,S);for(var y=0;y<N;y++)for(var x=0;x<N;x++){if(g[y][x]==1){X.fillStyle='#17120a';X.fillRect(x*T,y*T,T,T);X.strokeStyle='#6c5728';X.strokeRect(x*T+1,y*T+1,T-2,T-2)}else{X.fillStyle='#080808';X.fillRect(x*T,y*T,T,T);if(g[y][x]==2||g[y][x]==3){X.font=T*.62+'px Arial';X.textAlign='center';X.textBaseline='middle';X.fillText(g[y][x]==2?'🕶️':'🍹',x*T+T/2,y*T+T/2)}}}X.font=T*.72+'px Arial';X.textAlign='center';X.textBaseline='middle';gs.forEach(function(a){X.fillText('🗿',a.x*T+T/2,a.y*T+T/2)});X.shadowColor='#f5d47b';X.shadowBlur=10;X.fillText('👑',k.x*T+T/2,k.y*T+T/2);X.shadowBlur=0}function loop(t){acc+=Math.min(50,t-last||16);last=t;if(acc>145){acc=0;step()}draw();requestAnimationFrame(loop)}function start(){reset();run=true;dir={x:0,y:0};q={x:0,y:0};document.getElementById('menu').classList.add('hidden');document.getElementById('over').classList.add('hidden');document.getElementById('win').classList.add('hidden')}document.getElementById('play').onclick=start;document.getElementById('retry').onclick=start;document.getElementById('again').onclick=start;var M={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}};document.querySelectorAll('.pad').forEach(function(b){function h(e){e.preventDefault();open(M[b.dataset.d])}b.addEventListener('touchstart',h,{passive:false});b.addEventListener('pointerdown',h,{passive:false})});var tx=0,ty=0;
C.addEventListener('touchstart',function(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY},{passive:true});
C.addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))open(dx>0?{x:1,y:0}:{x:-1,y:0});else open(dy>0?{x:0,y:1}:{x:0,y:-1})},{passive:true});
reset();requestAnimationFrame(loop)})();</script></body></html>
